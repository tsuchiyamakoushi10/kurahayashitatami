<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Header Component - Mobile Preview - 倉林畳店</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    /* ============ DESIGN TOKENS ============ */
    :root {
      --sumi: #15120d;
      --sumi-2: #211b14;
      --sumi-3: #332a1e;
      --washi: #f2ead9;
      --washi-2: #e8dbbc;
      --washi-3: #d5c39a;
      --vermillion: #9c3b26;
      --vermillion-deep: #742a1b;
      --igusa: #4c5a2b;
      --igusa-deep: #37411d;
      --gold: #a6864f;
      --ink: #15120d;
      --ink-70: rgba(21, 18, 13, .72);
      --ink-45: rgba(21, 18, 13, .62);
      --paper-70: rgba(242, 234, 217, .78);
      --paper-45: rgba(242, 234, 217, .68);
      --font-d: 'Shippori Mincho', serif;
      --font-b: 'Zen Kaku Gothic New', sans-serif;
      --maxw: 1180px;
    }

    /* ============ RESET & BASE ============ */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 375px;
      margin: 0 auto;
      border-left: 1px solid #ccc;
      border-right: 1px solid #ccc;
    }

    body {
      font-family: var(--font-b);
      background: var(--washi);
      color: var(--ink);
      width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    /* ============ HEADER ============ */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(21, 18, 13, .95);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid rgba(166, 134, 79, .25);
      width: 375px;
      margin-left: auto;
      margin-right: auto;
    }

    .header-wrap {
      max-width: var(--maxw);
      padding: 0 28px;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ============ LOGO ============ */
    .logo {
      font-family: var(--font-d);
      font-weight: 700;
      font-size: 21px;
      color: var(--washi);
      letter-spacing: .08em;
      flex: 0 0 auto;
      min-width: 0;
    }

    .logo small {
      display: none;
    }

    /* ============ HEADER RIGHT SECTION ============ */
    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
      flex: 0 0 auto;
    }

    /* ============ NAVIGATION (PC) ============ */
    .nav-desktop {
      display: none;
    }

    /* ============ CONTACT BUTTON ============ */
    .contact-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--igusa);
      color: var(--washi);
      padding: 10px 18px;
      border-radius: 3px;
      font-family: var(--font-b);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: .03em;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
      transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
      white-space: nowrap;
    }

    .contact-btn:active {
      transform: translateY(0);
      background: var(--igusa-deep);
    }

    .contact-btn svg {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
    }

    .contact-btn .label {
      display: none;
    }

    /* ============ HAMBURGER MENU (Mobile) ============ */
    .menu-btn {
      width: 44px;
      height: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 1px solid rgba(242, 234, 217, .35);
      border-radius: 2px;
      background: transparent;
    }

    .menu-btn span {
      width: 20px;
      height: 1px;
      background: var(--washi);
      transition: all .3s ease;
    }

    .menu-btn[aria-expanded="true"] span:nth-child(1) {
      transform: translateY(6px) rotate(45deg);
    }

    .menu-btn[aria-expanded="true"] span:nth-child(2) {
      opacity: 0;
    }

    .menu-btn[aria-expanded="true"] span:nth-child(3) {
      transform: translateY(-6px) rotate(-45deg);
    }

    /* ============ MOBILE NAV OVERLAY ============ */
    .nav-overlay {
      position: fixed;
      inset: 0;
      z-index: 99;
      background: var(--sumi);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-12px);
      transition: opacity .4s ease, transform .4s ease, visibility 0s linear .4s;
      width: 375px;
      margin-left: auto;
      margin-right: auto;
    }

    .nav-overlay.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition: opacity .4s ease, transform .4s ease;
    }

    .nav-overlay ul {
      list-style: none;
      text-align: center;
    }

    .nav-overlay li {
      margin: 20px 0;
    }

    .nav-overlay a {
      font-family: var(--font-d);
      font-size: clamp(24px, 5vw, 38px);
      color: var(--washi);
      font-weight: 600;
      position: relative;
      padding-bottom: 4px;
      display: inline-block;
      transition: color .25s ease;
    }

    .nav-overlay a::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -2px;
      height: 1px;
      background: var(--gold);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .35s ease;
    }

    .nav-overlay a:active {
      color: var(--gold);
    }

    .nav-overlay a:active::after {
      transform: scaleX(1);
    }

    .nav-overlay li:first-child a::after {
      transform: scaleX(1);
    }

    /* ============ LAYOUT ADJUSTMENT ============ */
    body {
      padding-top: 76px;
    }

    /* ============ DEMO CONTENT ============ */
    main {
      padding: 0 28px;
      font-family: var(--font-b);
      color: var(--ink);
      line-height: 1.8;
    }

    section {
      padding: 60px 0;
      border-bottom: 1px solid var(--washi-3);
    }

    section h1,
    section h2 {
      font-family: var(--font-d);
      margin-bottom: 20px;
    }

    section h1 {
      font-size: 24px;
    }

    section h2 {
      font-size: 20px;
    }

    section p {
      font-size: 14px;
      color: var(--ink-70);
    }

    /* ============ DEVICE FRAME ============ */
    .device-label {
      position: fixed;
      top: 0;
      left: -60px;
      font-size: 11px;
      color: #999;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      letter-spacing: 2px;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<!-- Device Label -->
<div class="device-label">MOBILE 375px</div>

<!-- ============ HEADER ============ -->
<header class="site-header">
  <div class="header-wrap">
    <!-- Logo -->
    <div class="logo">倉林畳店</div>

    <!-- Header Right Section -->
    <div class="header-right">
      <!-- Contact Button -->
      <a class="contact-btn" href="tel:0274522966" aria-label="電話をかける">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
      </a>

      <!-- Hamburger Menu Button (Mobile) -->
      <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-label="メニューを開く">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>

<!-- ============ MOBILE NAV OVERLAY ============ -->
<nav class="nav-overlay" id="navOverlay">
  <ul>
    <li><a href="#top">TOP</a></li>
    <li><a href="#tatami-types">畳の種類・料金</a></li>
    <li><a href="#cases">導入事例</a></li>
    <li><a href="#about">畳について</a></li>
    <li><a href="#company">会社概要</a></li>
    <li><a href="#contact">問い合わせ</a></li>
  </ul>
</nav>

<!-- ============ PAGE CONTENT (Demo) ============ -->
<main>
  <section id="top">
    <h1>TOP</h1>
    <p>これはスマホサイズ(375px)でのヘッダーコンポーネントのプレビューです。ハンバーガーメニューをタップしてメニューを開いてみてください。</p>
  </section>

  <section id="tatami-types">
    <h2>畳の種類・料金</h2>
    <p>畳の種類と料金についての情報がここに入ります。</p>
  </section>

  <section id="cases">
    <h2>導入事例</h2>
    <p>施工事例についての情報がここに入ります。</p>
  </section>

  <section id="about">
    <h2>畳について</h2>
    <p>畳についての詳細情報がここに入ります。</p>
  </section>

  <section id="company">
    <h2>会社概要</h2>
    <p>倉林畳店についての会社情報がここに入ります。</p>
  </section>

  <section id="contact">
    <h2>問い合わせ</h2>
    <p>お問い合わせフォームがここに入ります。</p>
  </section>
</main>

<!-- ============ JAVASCRIPT ============ -->
<script>
  // Hamburger menu toggle
  const menuBtn = document.getElementById('menuBtn');
  const navOverlay = document.getElementById('navOverlay');

  // Menu button click handler
  menuBtn.addEventListener('click', function () {
    const isExpanded = this.getAttribute('aria-expanded') === 'true';
    this.setAttribute('aria-expanded', !isExpanded);
    navOverlay.classList.toggle('open');
  });

  // Navigation link click handler (close menu when link is clicked)
  const navLinks = navOverlay.querySelectorAll('a');
  navLinks.forEach(link => {
    link.addEventListener('click', function () {
      menuBtn.setAttribute('aria-expanded', 'false');
      navOverlay.classList.remove('open');
    });
  });

  // Close menu when clicking outside (on overlay background)
  navOverlay.addEventListener('click', function (e) {
    if (e.target === this) {
      menuBtn.setAttribute('aria-expanded', 'false');
      navOverlay.classList.remove('open');
    }
  });

  // Close menu with Escape key
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      menuBtn.setAttribute('aria-expanded', 'false');
      navOverlay.classList.remove('open');
    }
  });
</script>

</body>
</html>
