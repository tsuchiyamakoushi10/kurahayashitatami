<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>倉林畳店 | 妥協しない一枚が信頼をつくる</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../design/tokens.css">
  <style>
    /* ============ RESET & BASE ============ */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--washi);
      color: var(--ink);
      font-family: var(--font-b);
      line-height: 1.9;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    img, svg {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    /* ============ LAYOUT ============ */
    .wrap {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 28px;
    }

    /* ============ HERO SECTION ============ */
    .hero {
      position: relative;
      min-height: 100svh;
      display: flex;
      align-items: flex-end;
      padding: 150px 0 90px;
      color: var(--washi);
      overflow: hidden;
    }

    .hero-photo {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(21, 18, 13, .35) 0%, rgba(21, 18, 13, .55) 55%, rgba(21, 18, 13, .94) 100%),
        radial-gradient(ellipse at 30% 20%, #4a4034 0%, transparent 55%),
        linear-gradient(135deg, #2b2419 0%, #1c1710 45%, #100d09 100%);
    }

    .hero-photo .grain {
      position: absolute;
      inset: 0;
      opacity: .4;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3'/></filter><rect width='100%25' height='100%25' filter='url(%23g)' opacity='0.5'/></svg>");
    }

    .photo-note {
      position: absolute;
      top: 24px;
      right: 24px;
      font-family: var(--font-b);
      font-size: 12px;
      letter-spacing: .1em;
      color: rgba(242, 234, 217, .55);
      border: 1px solid rgba(242, 234, 217, .3);
      padding: 5px 9px;
      border-radius: 2px;
      z-index: 3;
    }

    .hero-inner {
      position: relative;
      z-index: 2;
      width: 100%;
    }

    .hero-eyebrow {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 26px;
      color: var(--gold);
      letter-spacing: .28em;
      font-size: 13px;
    }

    .hero-eyebrow .line {
      width: 44px;
      height: 1px;
      background: var(--gold);
    }

    .hero .catch {
      color: var(--washi);
      font-family: var(--font-d);
      font-weight: 800;
      font-size: clamp(40px, 8vw, 96px);
      line-height: 1.25;
      letter-spacing: .02em;
      text-shadow: 0 6px 30px rgba(0, 0, 0, .5);
    }

    .catch em {
      font-style: normal;
      color: #c9a24a;
      display: block;
    }

    .hero .sub {
      margin-top: 26px;
      max-width: 520px;
      font-family: var(--font-d);
      font-size: 16px;
      color: rgba(242, 234, 217, .92);
      font-weight: 600;
      letter-spacing: .02em;
    }

    /* ============ HERO CTA BUTTONS ============ */
    .hero-cta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 44px;
    }

    /* Contact Button (共通コンポーネント .cta-btn) */
    .hero-cta .cta-btn,
    .hero-cta .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--igusa);
      color: var(--washi);
      padding: 14px 28px;
      border-radius: 3px;
      font-family: var(--font-b);
      font-weight: 700;
      font-size: 16px;
      letter-spacing: .03em;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
      transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
      white-space: nowrap;
    }

    .hero-cta .cta-btn:hover,
    .hero-cta .btn-primary:hover {
      transform: translateY(-2px);
      background: var(--igusa-deep);
      box-shadow: 0 8px 20px rgba(0, 0, 0, .4);
    }

    .hero-cta .cta-btn:active,
    .hero-cta .btn-primary:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
    }

    .hero-cta .cta-btn svg,
    .hero-cta .btn-primary svg {
      width: 15px;
      height: 15px;
      flex: 0 0 15px;
    }

    /* Ghost Button (ページ内リンク) */
    .hero-cta .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      border: 1px solid rgba(242, 234, 217, .4);
      border-radius: 3px;
      color: var(--washi);
      font-family: var(--font-b);
      font-weight: 700;
      font-size: 16px;
      letter-spacing: .03em;
      transition: transform .25s ease, border-color .25s ease, background .25s ease;
      white-space: nowrap;
    }

    .hero-cta .btn-ghost:hover {
      transform: translateY(-2px);
      border-color: var(--washi);
      background: rgba(242, 234, 217, .08);
    }

    .hero-cta .btn-ghost:active {
      transform: translateY(0);
    }

    .hero-cta .btn-ghost svg {
      width: 15px;
      height: 15px;
      flex: 0 0 15px;
    }

    /* ============ SCROLL CUE ============ */
    .hero .scroll-cue {
      position: absolute;
      left: 28px;
      bottom: 26px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(242, 234, 217, .6);
      font-size: 12px;
      letter-spacing: .22em;
    }

    .scroll-cue .stem {
      width: 1px;
      height: 38px;
      background: linear-gradient(var(--gold), transparent);
      animation: drip 2.4s ease-in-out infinite;
    }

    @keyframes drip {
      0% { opacity: .2; }
      50% { opacity: 1; }
      100% { opacity: .2; }
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 599px) {
      .hero {
        padding: 100px 0 60px;
        min-height: auto;
      }

      .hero-eyebrow {
        font-size: 11px;
        margin-bottom: 20px;
      }

      .hero-eyebrow .line {
        width: 28px;
      }

      .catch {
        font-size: clamp(28px, 7vw, 40px);
        line-height: 1.3;
      }

      .sub {
        margin-top: 16px;
        font-size: 14px;
        max-width: 100%;
      }

      .hero-cta {
        flex-direction: column;
        gap: 10px;
        margin-top: 32px;
      }

      .hero-cta .cta-btn,
      .hero-cta .btn-ghost {
        width: 100%;
        justify-content: center;
        padding: 12px 20px;
        font-size: 14px;
      }

      .photo-note {
        top: 16px;
        right: 16px;
        font-size: 11px;
      }

      .scroll-cue {
        left: 20px;
        bottom: 20px;
        font-size: 10px;
      }

      .scroll-cue .stem {
        height: 28px;
      }
    }

    /* ============ PAIN POINTS ============ */
    section {
      position: relative;
      padding: 110px 0;
    }

    .washi-tex {
      position: relative;
      background: var(--washi);
    }

    .washi-tex::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .5;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.08  0 0 0 0 0.07  0 0 0 0 0.05  0 0 0 0.05 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      background-size: 220px 220px;
    }

    .section-head {
      max-width: 640px;
      margin-bottom: 56px;
      position: relative;
      z-index: 1;
    }

    .section-head .eyebrow {
      color: var(--vermillion);
      margin-bottom: 16px;
      font-family: var(--font-d);
      font-weight: 700;
    }

    .section-title {
      font-family: var(--font-d);
      font-weight: 700;
      font-size: clamp(26px, 3.6vw, 40px);
      line-height: 1.55;
      color: var(--ink);
      position: relative;
      z-index: 1;
    }

    .pain-list {
      list-style: none;
      display: grid;
      gap: 0;
      position: relative;
      z-index: 1;
    }

    .pain-list li {
      display: flex;
      align-items: baseline;
      gap: 22px;
      padding: 26px 0;
      border-bottom: 1px solid var(--washi-3);
      font-family: var(--font-d);
      font-weight: 700;
      font-size: clamp(17px, 2.2vw, 22px);
      color: var(--ink);
    }

    .pain-list li:first-child {
      border-top: 1px solid var(--washi-3);
    }

    .pain-list .mark {
      color: var(--vermillion);
      font-size: 22px;
      flex: none;
    }

    .pain-resolve {
      margin-top: 44px;
      font-family: var(--font-d);
      font-weight: 700;
      font-size: clamp(20px, 2.8vw, 28px);
      color: var(--vermillion);
      text-align: center;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>

<!-- ============ HERO SECTION ============ -->
<section class="hero">
  <div class="hero-photo"><div class="grain"></div></div>
  <span class="photo-note">写真枠 P-01 / 職人が畳表を裁断・縫い付ける姿</span>

  <div class="wrap hero-inner">
    <div class="hero-eyebrow">
      <span class="line"></span>KURAHAYASHI TATAMI
    </div>

    <h1 class="catch">
      妥協しない<br>一枚が<em>信頼</em>をつくる
    </h1>

    <p class="sub">
      創業83年。地域に根ざし、一枚一枚に真心を込めて<br>畳づくりを続けてきました。
    </p>

    <div class="hero-cta">
      <!-- Contact Button - Using .cta-btn from shared component -->
      <a href="tel:0274522966" class="cta-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        <span>まずはご相談ください</span>
      </a>

      <!-- Internal Link - Ghost Button Style -->
      <a href="#tatami" class="btn-ghost">
        <span>畳について知りたい方はこちら</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </a>
    </div>
  </div>

  <div class="scroll-cue">
    <span class="stem"></span>SCROLL
  </div>
</section>

<!-- ============ PAIN POINTS ============ -->
<section class="washi-tex">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow">こんなことに困っていませんか</div>
      <h2 class="section-title">畳の"気になる"を、<br>そのままにしていませんか。</h2>
    </div>

    <ul class="pain-list">
      <li><span class="mark">・</span>畳が色あせてお部屋が古く見える</li>
      <li><span class="mark">・</span>費用や張り替え時期が分からず、そのままになっている</li>
      <li><span class="mark">・</span>子どもが安心して遊べる部屋にしたい</li>
    </ul>

    <p class="pain-resolve">そのお悩み、畳を替えることで解決できます。</p>
  </div>
</section>

</body>
</html>
