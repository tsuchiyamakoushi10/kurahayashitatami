<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ページが見つかりません | 倉林畳店</title>
  <meta name="description" content="お探しのページは見つかりませんでした。倉林畳店のトップページ、または各ページからお探しください。">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#15120d">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/design/tokens.css">
  <link rel="stylesheet" href="/design/components.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
      background: var(--sumi);
      color: var(--washi);
      font-family: var(--font-b);
      line-height: 1.9;
      -webkit-font-smoothing: antialiased;
      word-break: auto-phrase;
    }

    img { display: block; max-width: 100%; height: auto; }
    a { color: inherit; text-decoration: none; }

    .inner {
      width: 100%;
      max-width: 620px;
      text-align: center;
    }

    .logo {
      width: 132px;
      margin: 0 auto 40px;
      opacity: .92;
    }

    .code {
      font-family: var(--font-d);
      font-weight: 400;
      font-size: 15px;
      letter-spacing: .34em;
      text-indent: .34em;
      color: var(--gold);
    }

    h1 {
      margin-top: 16px;
      font-family: var(--font-d);
      font-weight: 700;
      font-size: clamp(25px, 5.6vw, 36px);
      line-height: 1.6;
      color: var(--washi);
    }

    .lead {
      margin-top: 20px;
      font-weight: 500;
      font-size: 15.5px;
      color: var(--paper-70);
    }

    /* ---- トップへ戻る導線 ---- */
    .home {
      display: inline-block;
      margin-top: 36px;
      padding: 15px 44px;
      border: 1.5px solid var(--gold);
      border-radius: 3px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: .08em;
      color: var(--washi);
      transition: background .28s ease, color .28s ease;
    }

    .home:hover,
    .home:focus-visible {
      background: var(--gold);
      color: var(--sumi);
    }

    /* ---- 各ページへの案内 ---- */
    .links {
      margin-top: 44px;
      padding-top: 30px;
      border-top: 1px solid rgba(166, 134, 79, .25);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 30px;
    }

    .links a {
      font-weight: 500;
      font-size: 15px;
      color: var(--paper-70);
      transition: color .28s ease;
    }

    .links a:hover,
    .links a:focus-visible {
      color: var(--gold);
    }

    /* ---- 電話（トップの .big-tel と同じ見た目） ---- */
    .big-tel {
      margin-top: 40px;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 26px 44px;
      border: 1.5px solid var(--gold);
      border-radius: 3px;
    }

    .big-tel .label {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: .18em;
      color: var(--gold);
    }

    .big-tel .number {
      font-family: var(--font-d);
      font-weight: 800;
      font-size: clamp(28px, 5vw, 38px);
      color: var(--washi);
    }

    .big-tel .hours {
      margin-top: 6px;
      font-weight: 500;
      font-size: 15px;
      color: var(--paper-70);
    }

    @media (max-width: 599px) {
      body { padding: 48px 20px; }
      .logo { width: 108px; margin-bottom: 32px; }
      .big-tel { padding: 22px 24px; }
      .links { gap: 10px 22px; }
    }
  </style>
</head>
<body>

<div class="inner">
  <a href="/"><img class="logo" src="/logo-white-transparent.png" alt="倉林畳店" width="1220" height="930"></a>

  <p class="code">404 NOT FOUND</p>
  <h1>お探しのページが<br>見つかりませんでした</h1>
  <p class="lead">
    ページが移動または削除された可能性があります。<br>
    下のリンクからお探しください。
  </p>

  <a class="home" href="/">トップページへ戻る</a>

  <nav class="links">
    <a href="/products">商品紹介</a>
    <a href="/works">施工事例</a>
    <a href="/tatami">畳について</a>
    <a href="/company-story">想いと歩み</a>
  </nav>

  <a class="big-tel" href="tel:0274522966">
    <span class="label">TEL / FAX</span>
    <span class="number">0274-52-2966</span>
    <span class="hours">受付時間 8:00〜20:00</span>
  </a>
</div>

</body>
</html>
